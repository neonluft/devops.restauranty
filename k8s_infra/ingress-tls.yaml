apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restauranty
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod  # switch to letsencrypt-prod once it works
    nginx.ingress.kubernetes.io/ssl-redirect: "true"      # HTTP -> HTTPS
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - florik.ironlabs.online           # your real hostname
      secretName: restauranty-tls    # cert-manager creates this Secret
  rules:
    - host: florik.ironlabs.online          # your real hostname (a certificate needs a DNS name)
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 3001
          - path: /api/discounts
            pathType: Prefix
            backend:
              service:
                name: discounts
                port:
                  number: 3002
          - path: /api/items
            pathType: Prefix
            backend:
              service:
                name: items
                port:
                  number: 3003
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client         # must match your frontend Service name
                port:
                  number: 3000       # and its port