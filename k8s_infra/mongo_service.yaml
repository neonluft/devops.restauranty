apiVersion: v1
kind: Service
metadata:
  name: mongo            # must match the host in MONGODB_URI (mongodb://mongo:27017/flor)
  labels:
    app: mongo
spec:
  clusterIP: None        # headless: governing service for the StatefulSet
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017