# Loki in single-binary mode with filesystem storage (fine for a small project cluster).
# Confirm the accepted mode name for your chart version:
#   helm show values grafana-community/loki | grep -n -i -B1 -A3 deploymentMode
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true
    retention_period: 168h        # keep 7 days of logs
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp2   
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Switch off the components of the distributed modes
backend:        { replicas: 0 }
read:           { replicas: 0 }
write:          { replicas: 0 }
ingester:       { replicas: 0 }
querier:        { replicas: 0 }
queryFrontend:  { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor:    { replicas: 0 }
compactor:      { replicas: 0 }
indexGateway:   { replicas: 0 }
bloomPlanner:   { replicas: 0 }
bloomBuilder:   { replicas: 0 }
bloomGateway:   { replicas: 0 }

# Not needed for this setup (saves memory and pods)
gateway:      { enabled: false }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }