# Alloy tails container logs through the Kubernetes API, so one replica is enough
# (no hostPath mounts, no duplicate logs).
controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["default"]   // namespace where auth, discounts, items, client and mongo run
        }
      }

      discovery.relabel "app_pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "app" {
        targets    = discovery.relabel.app_pods.output
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }